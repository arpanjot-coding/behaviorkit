name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_engine.py tests/test_system_foundations.py tests/test_contract_edges.py tests/test_operations.py -q
  vision-contracts:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[vision,cpu,dev]"
      - if: runner.os == 'macOS'
        run: python -c "import platform,onnxruntime as o; assert platform.machine()=='arm64'; assert 'CoreMLExecutionProvider' in o.get_available_providers()"
      - run: python scripts/validate_platform.py --output runs/platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-${{ matrix.os }}
          path: runs/platform
  optional-tracking:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[vision,cpu,tracking,resources,custom,dev]"
      - run: python -m pytest tests -q
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m behaviorkit demo --output runs/package-demo
      - run: python -c "from importlib.resources import files; assert files('behaviorkit').joinpath('wizard.html').is_file(); from behaviorkit.advanced import parse_scene"
      - run: python -c "import json; from pathlib import Path; r=json.loads(Path('runs/package-demo/summary.json').read_text()); assert r['status']=='ok' and r['events']==1 and r['count_samples']==41"
