name: Bug report
description: Report a reproducible library, CLI or model-contract failure.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: BehaviorKit version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Actual hardware and runtime
      description: OS, Python, CPU/GPU, ONNX Runtime and requested/selected provider. A sanitized doctor result helps.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Command/Python example, configuration and minimal observations or artifact hash. Remove private data and credentials.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include source time or event ID and any error/diagnostic.
    validations:
      required: true
